<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Document Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="mb-4">
      <h1 class="display-title">Long document in, short summary out.</h1>
      <p class="text-muted mb-0">Paste text or upload a PDF, TXT, or MD file.</p>
    </header>

    <div class="row g-4">
      <section class="col-lg-6">
        <div class="panel">
          <ul class="nav nav-tabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-text" type="button">Paste text</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-file" type="button">Upload file</button></li>
          </ul>
          <div class="tab-content pt-3">
            <div class="tab-pane fade show active" id="tab-text">
              <label for="text" class="visually-hidden">Document text</label>
              <textarea id="text" class="form-control" rows="12" placeholder="Paste your article, report, or notes here"></textarea>
              <div class="small text-muted mt-1" id="wordCount">0 words</div>
            </div>
            <div class="tab-pane fade" id="tab-file">
              <label id="dropzone" class="dropzone" for="file">
                <span id="fileLabel">Drop a file here or click to choose (max 10 MB)</span>
                <input type="file" id="file" accept=".pdf,.txt,.md" hidden>
              </label>
            </div>
          </div>

          <div class="row g-3 mt-1">
            <div class="col-sm-6">
              <label class="form-label" for="length">Length</label>
              <select id="length" class="form-select">
                <option value="short">Short (3)</option>
                <option value="medium" selected>Medium (6)</option>
                <option value="long">Long (10)</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="style">Format</label>
              <select id="style" class="form-select">
                <option value="paragraph">Paragraph</option>
                <option value="bullets">Bullet points</option>
              </select>
            </div>
          </div>
          <button id="go" class="btn btn-primary w-100 mt-3">Summarize</button>
          <div id="error" class="alert alert-danger mt-3 d-none" role="alert"></div>
        </div>
      </section>

      <section class="col-lg-6">
        <div class="panel result" aria-live="polite">
          <div id="empty" class="empty">Your summary will appear here.</div>
          <div id="loading" class="empty d-none"><span class="spinner-border spinner-border-sm me-2"></span>Reading your document…</div>
          <div id="output" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span id="stats" class="small text-muted"></span>
              <button id="copy" class="btn btn-sm btn-outline-secondary">Copy summary</button>
            </div>
            <div id="summary" class="summary"></div>
            <span id="mode" class="badge text-bg-light mt-3"></span>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
